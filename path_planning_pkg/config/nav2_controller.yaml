controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0          # doubled from 10 → 20 Hz for faster reaction to moving obstacle
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001     # FIX #5: was 0.5 — wrong for a diff-drive robot that cannot move sideways.
                                        # 0.5 caused DWB to treat any lateral velocity below 0.5 m/s as zero,
                                        # masking controller bugs. Match min_x threshold: 0.001.
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["goal_checker"]
    current_goal_checker: "goal_checker"
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.3
      movement_time_allowance: 20.0
      stateful: true

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 3.14
      stateful: True

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: false
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.22                   # slowed from 0.26 → 0.22 m/s so robot has more time to react
      max_vel_y: 0.0
      max_vel_theta: 1.0
      min_speed_xy: 0.0
      max_speed_xy: 0.22
      min_speed_theta: 0.0
      acc_lim_x: 2.5
      acc_lim_y: 0.0
      acc_lim_theta: 3.2
      decel_lim_x: -2.5
      decel_lim_y: 0.0
      decel_lim_theta: -3.2
      vx_samples: 25
      vy_samples: 5
      vtheta_samples: 25
      sim_time: 2.5
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.25
      trans_stopped_velocity: 0.25
      short_circuit_trajectory_evaluation: true
      stateful: true

      # ObstacleFootprint scores trajectories based on the robot's actual
      # footprint, not just its center point. Without this, the robot body
      # clips obstacles even when the center-point path looks clear.
      critics:
        ["RotateToGoal", "Oscillation", "ObstacleFootprint", "GoalAlign",
         "PathAlign", "PathDist", "GoalDist"]

      ObstacleFootprint.scale: 0.02

      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.2
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.2
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      rotate_to_goal: false

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 20.0
      publish_frequency: 10.0
      global_frame: odom
      robot_base_frame: base_footprint
      use_sim_time: false
      rolling_window: true
      width: 5                           # widened from 4 → 5 m so robot sees obstacle sooner
      height: 5
      resolution: 0.05
      robot_radius: 0.22

      plugins: ['obstacle_layer', 'inflation_layer']

      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan_filtered   # FIX: use laser_filters output, not raw /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: LaserScan
          raytrace_max_range: 3.5        # increased to clear stale cells faster
          raytrace_min_range: 0.0
          obstacle_max_range: 3.0        # increased so obstacle is marked earlier
          obstacle_min_range: 0.0

      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        enabled: true
        inflation_radius: 0.75           # increased from 0.55 → 0.75 m
        inflate_unknown: false
        inflate_around_unknown: true     # unknown cells near obstacles also inflated
        cost_scaling_factor: 2.5         # reduced from 5.0 → 2.5 so repulsion stays strong further out

      always_send_full_costmap: false